<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">

  <defs>

    <!-- Main Neon Gradient -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff00ff"/>
      <stop offset="50%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong Glow -->
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glass Effect -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#050816"/>

  <!-- Galaxy Aura -->
  <circle cx="512" cy="370" r="280"
          fill="url(#mainGradient)"
          opacity="0.12"
          filter="url(#strongGlow)"/>

  <!-- Universe Ring -->
  <circle
      cx="512"
      cy="360"
      r="235"
      fill="none"
      stroke="url(#mainGradient)"
      stroke-width="10"
      filter="url(#neonGlow)"/>

  <!-- Orbit -->
  <ellipse
      cx="512"
      cy="420"
      rx="360"
      ry="90"
      fill="none"
      stroke="url(#mainGradient)"
      stroke-width="18"
      transform="rotate(-10 512 420)"
      filter="url(#neonGlow)"/>

  <!-- Main M -->
  <path
      d="
      M320 650
      L320 300
      C320 250 360 230 400 270
      L512 420
      L624 270
      C664 230 704 250 704 300
      L704 650
      "
      fill="none"
      stroke="url(#mainGradient)"
      stroke-width="70"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#neonGlow)"/>

  <!-- Highlight on M -->
  <path
      d="
      M350 300
      L490 460
      "
      stroke="url(#glass)"
      stroke-width="10"
      stroke-linecap="round"
      opacity="0.7"/>

  <!-- Planet -->
  <circle
      cx="650"
      cy="220"
      r="32"
      fill="url(#mainGradient)"
      filter="url(#neonGlow)"/>

  <!-- Stars -->
  <g fill="#ffffff" filter="url(#neonGlow)">
    <polygon points="512,120 525,160 565,173 525,186 512,226 499,186 459,173 499,160"/>
    <polygon points="400,190 408,214 432,222 408,230 400,254 392,230 368,222 392,214"/>
    <polygon points="600,300 608,324 632,332 608,340 600,364 592,340 568,332 592,324"/>
    <circle cx="420" cy="140" r="5"/>
    <circle cx="590" cy="170" r="4"/>
    <circle cx="470" cy="280" r="4"/>
  </g>

  <!-- mpade -->
  <text
      x="512"
      y="820"
      text-anchor="middle"
      font-family="Poppins, Arial, sans-serif"
      font-size="110"
      font-weight="600"
      fill="url(#mainGradient)"
      filter="url(#neonGlow)">
      mpade
  </text>

  <!-- UNIVERSE -->
  <text
      x="512"
      y="900"
      text-anchor="middle"
      font-family="Poppins, Arial, sans-serif"
      font-size="50"
      letter-spacing="16"
      fill="url(#mainGradient)"
      filter="url(#neonGlow)">
      UNIVERSE
  </text>

</svg>
