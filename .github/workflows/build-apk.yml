name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 4. Build React Web App
        env:
          CI: false
        run: npm run build

      - name: 5. Setup Capacitor & Sync
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Mpade Universe" "com.mpade.app" --web-dir dist || true
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: 6. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 7. Compile Android APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Mpade-Universe-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
